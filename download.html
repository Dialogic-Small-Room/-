<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'DotGothic16', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url('coming_soon.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      height: 100vh;
    }

    header, footer {
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      text-align: center;
      padding: 10px 0;
      border-top: 2px solid white;
      border-bottom: 2px solid white;
    }

    header h1 {
      margin: 0;
      padding: 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 160px); /* 画面の高さからheaderとfooterの高さを引く */
    }

    .menu-icon {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 30px;
      cursor: pointer;
      z-index: 9999;
      padding: 10px;
    }

    .menu-tab {
      position: fixed;
      top: 0;
      right: 0;
      background-color: black;
      width: 200px;
      padding: 20px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 999;
      border-left: 2px solid white;
    }

    .menu-tab ul {
      list-style-type: none;
      padding: 0;
    }

    .menu-tab ul li {
      margin-bottom: 10px;
    }

    .menu-tab ul li a {
      color: white;
      text-decoration: none;
      padding: 10px;
    }

    .menu-tab ul li a:hover {
      background-color: #003d80;
      border-radius: 5px;
    }

    .menu-tab.show-menu {
      transform: translateX(0);
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
  <div class="menu-tab">
    <ul>
      <li><a href="index.html">トップ</a></li>
      <li><a href="terms.html">利用規約</a></li>
      <li><a href="characters.html">キャラ紹介</a></li>
      <li><a href="ust_inst_download.html">UST & INST 配布</a></li>
    </ul>
  </div>
  <header>
    <h1>新バージョン準備中</h1>
  </header>
  <main>
    <div class="message">
      <!-- メッセージは画像内で表示するので、ここには何も表示しません -->
    </div>
  </main>
  <footer>
    <p>&copy; 2024 okinai</p>
  </footer>
  <script>
    function toggleMenu() {
      const menuTab = document.querySelector('.menu-tab');
      menuTab.classList.toggle('show-menu');
    }
  </script>
</body>
</html>
